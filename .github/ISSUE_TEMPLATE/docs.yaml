name: 문서화
description: 문서 작성/정리
title: "[DOCS] "
labels: ["docs"]
body:
  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      placeholder: 어떤 문서를 작성/정리하는지 설명해주세요
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: 문서 작성
        - label: 팀 공유
