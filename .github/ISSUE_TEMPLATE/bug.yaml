name: 버그
description: 오류/버그 리포트
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: 브랜치
      placeholder: develop
