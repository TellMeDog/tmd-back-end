spring:
  main:
    lazy-initialization: true
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    openai:
      api-key: ${NVIDIA_API_KEY}
      base-url: https://integrate.api.nvidia.com/v1
      chat:
        model: deepseek-ai/deepseek-v4-pro-0813
        temperature: 0.0
        max-tokens: 2048
    model:
      embedding: none
