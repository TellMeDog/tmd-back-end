spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update   # 최초 배포 시 update, 스키마 안정화되면 validate로 전환
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}   # Railway Redis는 기본적으로 비밀번호가 설정됨 (local과 차이점)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
  ai:
    openai:
      api-key: ${NVIDIA_API_KEY}
      base-url: https://integrate.api.nvidia.com/v1
      timeout: 10m
      max-retries: 0
      chat:
        model: deepseek-ai/deepseek-v4-pro-0813
        temperature: 0.0
jwt:
  secret-key: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

tourapi:
  service-key: ${TOUR_API_SERVICE_KEY}

cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: ${R2_BUCKET}
    public-url: ${R2_PUBLIC_URL}
    presigned-url-ttl-seconds: ${R2_PRESIGNED_URL_TTL_SECONDS:600}
    max-upload-bytes: ${R2_MAX_UPLOAD_BYTES:10485760}

oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI}

server:
  port: ${PORT:8080}
