version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tmd_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: tmd
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql/:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: tmd_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis/:/data

  # Spring Boot는 배포때 설정 예정.
